name: Release

# Triggered by pushing a tag of the form `vX.Y.Z(-suffix)`. Builds Linux
# and Windows Release artefacts, packages each with the runtime asset
# folders (shaders, scripts, models), and publishes everything as a
# GitHub Release attached to the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # softprops/action-gh-release needs this to publish

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libglfw3-dev \
            libglm-dev \
            libassimp-dev \
            libbullet-dev \
            libfreetype-dev \
            xvfb

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release -j

      - name: Stage runtime
        run: |
          mkdir -p stage/MistEngine-linux
          cp build-linux-release/MistEngine stage/MistEngine-linux/
          # Strip debug info for a slimmer archive — still leaves a
          # usable binary; debug symbols live in the build tree.
          strip --strip-unneeded stage/MistEngine-linux/MistEngine || true
          cp -r shaders scripts models stage/MistEngine-linux/
          # README + LICENSE so users have a starting point.
          cp README.md LICENSE stage/MistEngine-linux/

      - name: Package
        run: |
          cd stage
          tar -czf MistEngine-${{ github.ref_name }}-linux-x64.tar.gz MistEngine-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: stage/MistEngine-${{ github.ref_name }}-linux-x64.tar.gz

  windows:
    name: Windows Release
    # Pinned, not windows-latest.
    #
    # The windows-release preset generates for "Visual Studio 17 2022", and
    # windows-latest has rolled forward to an image whose Visual Studio is
    # newer, so Configure failed with "could not find any instance of Visual
    # Studio". Pinning the runner to the image that matches the generator keeps
    # CI and local VS 2022 builds on the same toolchain; moving to a newer
    # Visual Studio is a preset change, not something to absorb silently via a
    # floating runner label.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # vcpkg 2026.07.29. The previous pin (c8696863, early 2024) had rotted:
          # it resolves msys2 build deps by exact version, and msys2 deletes old
          # package versions from its mirrors, so Configure died with 404s on
          # mingw-w64-x86_64-pkgconf across every mirror in the set. A pinned
          # vcpkg baseline is not reproducible forever — it needs bumping when
          # its upstream sources disappear.
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      # Stands in for the disabled x-gha binary cache.
      #
      # Caches vcpkg's BINARY cache (prebuilt package archives), not
      # vcpkg_installed: the binary cache is the mechanism x-gha was providing,
      # it lives outside the build tree, and it survives a different binaryDir.
      # VCPKG_DEFAULT_BINARY_CACHE is pointed at it in the Configure step below.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_bincache
          key: vcpkg-${{ runner.os }}-9e593bb1-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-9e593bb1-

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg_bincache"

      - name: Configure
        shell: bash
        env:
          # run-vcpkg clones into ${{ github.workspace }}/vcpkg and exports that
          # path as RUNVCPKG_VCPKG_ROOT. This used to hardcode
          # ${{ runner.workspace }}/vcpkg, which is the PARENT of the checkout
          # directory — so CMAKE_TOOLCHAIN_FILE in the windows-release preset
          # ($env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake) pointed at a
          # path that does not exist and Configure died with "Could not find
          # toolchain file". Using the action's own exported value keeps this
          # correct if it ever changes where it clones to.
          VCPKG_ROOT: ${{ env.RUNVCPKG_VCPKG_ROOT }}
          # Disable vcpkg's GitHub-Actions binary cache.
          #
          # run-vcpkg defaults VCPKG_BINARY_SOURCES to "clear;x-gha,readwrite",
          # and the x-gha backend needs ACTIONS_RUNTIME_TOKEN + ACTIONS_CACHE_URL.
          # GitHub retired the cache-service v1 API those came from, so the
          # variables are no longer injected and vcpkg aborts the install with
          # "The GHA binary source requires ...". Dependencies are built from
          # source instead; the actions/cache step below keeps that off the
          # critical path on repeat runs.
          # "clear" drops run-vcpkg's broken x-gha default; "files,...,readwrite"
          # points vcpkg at the directory actions/cache restores above, so a
          # repeat run reuses prebuilt archives instead of rebuilding assimp and
          # bullet3 from source for ~15 minutes.
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Stage runtime
        shell: bash
        run: |
          mkdir -p stage/MistEngine-windows
          # The Windows build drops MistEngine.exe in build-windows-release/Release
          cp build-windows-release/Release/MistEngine.exe stage/MistEngine-windows/
          # DLLs are picked up by vcpkg's applocal step — copy whatever
          # ended up next to the exe.
          cp build-windows-release/Release/*.dll stage/MistEngine-windows/ 2>/dev/null || true
          cp -r shaders scripts models stage/MistEngine-windows/
          cp README.md LICENSE stage/MistEngine-windows/

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path stage/MistEngine-windows/* -DestinationPath stage/MistEngine-${{ github.ref_name }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: stage/MistEngine-${{ github.ref_name }}-windows-x64.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [linux, windows]
    # Windows is best-effort; Linux is required.
    #
    # This used to be a plain `needs: [linux, windows]`, so ANY platform
    # failing skipped publish entirely and the tag was left on the remote with
    # nothing attached. That is exactly what happened to v0.6.0-prealpha in
    # April: tagged, Windows broke, no release, dangling tag. A tag is a public
    # artefact — it should not be spent on a run that silently produces nothing.
    #
    # Now a Windows failure yields a Linux-only release whose asset list makes
    # the omission obvious, rather than no release at all.
    if: always() && needs.linux.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artefacts
        run: |
          find dist -type f
          if [ ! -d dist/windows-archive ]; then
            echo "::warning::Windows archive is missing — publishing a Linux-only release."
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MistEngine ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          # fail_on_unmatched_files defaults to false, so a missing
          # windows-archive (best-effort job) does not abort the publish.
          files: |
            dist/linux-archive/*.tar.gz
            dist/windows-archive/*.zip
          generate_release_notes: true
