name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux:
    name: Linux ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libglfw3-dev \
            libglm-dev \
            libassimp-dev \
            libbullet-dev \
            libfreetype-dev \
            xvfb

      - name: Configure
        run: cmake --preset linux-ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset linux-ci -j

      - name: Test (headless)
        run: ctest --preset linux-ci --output-on-failure

  macos:
    name: macOS Debug (library + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install ninja glfw glm assimp bullet freetype

      # The editor cannot RUN on macOS — Apple's OpenGL is frozen at 4.1 and
      # the renderer needs 4.6 (direct-state-access, compute shaders, SSBOs).
      # The library and the test suite build and run fine, because the tests
      # are headless by design: nothing in them opens a GL context.
      # This job exists so that stays true.
      - name: Configure
        run: cmake --preset mac-debug

      - name: Build
        run: cmake --build --preset mac-debug -j

      - name: Test (headless)
        run: ctest --preset mac-debug --output-on-failure

  windows:
    name: Windows Release
    # Pinned, not windows-latest.
    #
    # The windows-release preset generates for "Visual Studio 17 2022", and
    # windows-latest has rolled forward to an image whose Visual Studio is
    # newer, so Configure failed with "could not find any instance of Visual
    # Studio". Pinning the runner to the image that matches the generator keeps
    # CI and local VS 2022 builds on the same toolchain; moving to a newer
    # Visual Studio is a preset change, not something to absorb silently via a
    # floating runner label.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # vcpkg 2026.07.29. The previous pin (c8696863, early 2024) had rotted:
          # it resolves msys2 build deps by exact version, and msys2 deletes old
          # package versions from its mirrors, so Configure died with 404s on
          # mingw-w64-x86_64-pkgconf across every mirror in the set. A pinned
          # vcpkg baseline is not reproducible forever — it needs bumping when
          # its upstream sources disappear.
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      # Stands in for the disabled x-gha binary cache. Keyed on the manifest
      # and the vcpkg commit, so it invalidates when either changes.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-9e593bb1-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: bash
        env:
          # run-vcpkg clones into ${{ github.workspace }}/vcpkg and exports that
          # path as RUNVCPKG_VCPKG_ROOT. This used to hardcode
          # ${{ runner.workspace }}/vcpkg, which is the PARENT of the checkout
          # directory — so CMAKE_TOOLCHAIN_FILE in the windows-release preset
          # ($env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake) pointed at a
          # path that does not exist and Configure died with "Could not find
          # toolchain file". Using the action's own exported value keeps this
          # correct if it ever changes where it clones to.
          VCPKG_ROOT: ${{ env.RUNVCPKG_VCPKG_ROOT }}
          # Disable vcpkg's GitHub-Actions binary cache.
          #
          # run-vcpkg defaults VCPKG_BINARY_SOURCES to "clear;x-gha,readwrite",
          # and the x-gha backend needs ACTIONS_RUNTIME_TOKEN + ACTIONS_CACHE_URL.
          # GitHub retired the cache-service v1 API those came from, so the
          # variables are no longer injected and vcpkg aborts the install with
          # "The GHA binary source requires ...". Dependencies are built from
          # source instead; the actions/cache step below keeps that off the
          # critical path on repeat runs.
          VCPKG_BINARY_SOURCES: clear
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Test
        run: ctest --preset windows-release -C Release
