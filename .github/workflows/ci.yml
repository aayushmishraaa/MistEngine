name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux:
    name: Linux ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libglfw3-dev \
            libglm-dev \
            libassimp-dev \
            libbullet-dev \
            libfreetype-dev \
            xvfb

      - name: Configure
        run: cmake --preset linux-ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset linux-ci -j

      - name: Test (headless)
        run: ctest --preset linux-ci --output-on-failure

  macos:
    name: macOS Debug (library + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install ninja glfw glm assimp bullet freetype

      # The editor cannot RUN on macOS — Apple's OpenGL is frozen at 4.1 and
      # the renderer needs 4.6 (direct-state-access, compute shaders, SSBOs).
      # The library and the test suite build and run fine, because the tests
      # are headless by design: nothing in them opens a GL context.
      # This job exists so that stays true.
      - name: Configure
        run: cmake --preset mac-debug

      - name: Build
        run: cmake --build --preset mac-debug -j

      - name: Test (headless)
        run: ctest --preset mac-debug --output-on-failure

  windows:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: c8696863d371ab7f46e213d8f5ca923c4aef2a00

      - name: Configure
        shell: bash
        env:
          # run-vcpkg clones into ${{ github.workspace }}/vcpkg and exports that
          # path as RUNVCPKG_VCPKG_ROOT. This used to hardcode
          # ${{ runner.workspace }}/vcpkg, which is the PARENT of the checkout
          # directory — so CMAKE_TOOLCHAIN_FILE in the windows-release preset
          # ($env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake) pointed at a
          # path that does not exist and Configure died with "Could not find
          # toolchain file". Using the action's own exported value keeps this
          # correct if it ever changes where it clones to.
          VCPKG_ROOT: ${{ env.RUNVCPKG_VCPKG_ROOT }}
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Test
        run: ctest --preset windows-release -C Release
